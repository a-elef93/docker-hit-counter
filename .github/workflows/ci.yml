name: CI
on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -  name: Checkout code
         uses: actions/checkout@v4

      -  name: Build and start services
         run: docker compose up -d --build

      -  name: Smoke test
         run: curl -sS --fail --retry 10 --retry-delay 2 --retry-all-errors localhost:5000 | grep "visited"

      -  name: Show logs on failure
         if: failure()
         run: docker compose logs

      -  name: Log in to GHCR
         uses: docker/login-action@v3
         with:
           registry: ghcr.io
           username: ${{ github.actor}}
           password: ${{ secrets.GITHUB_TOKEN }}
